# Compatibility aliases for the existing Lab 2 Deployments.
# Both Services select the already-running pods labelled app=web.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tenant-a
spec:
  selector:
    app: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tenant-b
spec:
  selector:
    app: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

